<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex">
<link rel="stylesheet" href="../vendor/pptxjs/pptxjs.css">
<link rel="stylesheet" href="../vendor/pptxjs/nv.d3.min.css">
<style>html,body{margin:0;background:#fff}#out{width:max-content}#out .slide{margin:0 0 20px 0!important;border:0!important;box-shadow:none!important}</style>
<script src="../vendor/pptxjs/jquery-1.11.3.min.js"></script>
<script src="../vendor/pptxjs/jszip.min.js"></script>
<script src="../vendor/pptxjs/filereader.js"></script>
<script src="../vendor/pptxjs/d3.min.js"></script>
<script src="../vendor/pptxjs/nv.d3.min.js"></script>
<script src="../vendor/pptxjs/pptxjs.min.js"></script>
<script src="../vendor/html2canvas.min.js"></script>
<script src="common.js"></script>
</head><body><div id="out"></div>
<script>
window.renderDocument = function (buf) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(new Blob([buf]));
    var done = false;
    var timer = setTimeout(function () { if (!done) reject(new Error('E_TIMEOUT')); }, 120000);
    $('#out').pptxToHtml({ pptxFileUrl: url, slideMode: false, keyBoardShortCut: false, mediaProcess: false });
    (async function poll() {
      for (var k = 0; k < 1200; k++) {
        await RenderKit.wait(100);
        if (!document.querySelector('.slides-loadnig-msg') && document.querySelectorAll('#out .slide').length) break;
      }
      try {
        await RenderKit.settle(document.getElementById('out'));
        var pages = [], slides = document.querySelectorAll('#out .slide');
        for (var i = 0; i < slides.length; i++) {
          var s = slides[i];
          pages.push(await RenderKit.snap(s, { width: s.offsetWidth, height: s.offsetHeight }));
        }
        done = true; clearTimeout(timer); URL.revokeObjectURL(url);
        if (!pages.length) reject(new Error('E_EMPTY')); else resolve(pages);
      } catch (e) { done = true; clearTimeout(timer); reject(e); }
    })();
  });
};
</script></body></html>
