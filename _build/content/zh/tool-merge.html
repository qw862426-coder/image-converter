<h2>什么时候需要合并 PDF</h2>
<ul><li>求职时把简历、求职信和证书合成一个文件发送</li><li>把扫描的收据或发票汇总用于报销</li><li>把多份资料合成一个方便打印的文档</li></ul>
<h2>如何合并 PDF</h2>
<ol><li>选择 PDF。也可以加入 JPG、PNG 照片,每张成为一页。</li><li>用箭头调整顺序。</li><li>点击<b>合并成一个 PDF</b>并保存。</li></ol>
<h2>常见问题</h2>
<h3>合并会降低画质吗?</h3><p>不会。页面原样复制,文字、图片和链接都保持不变。</p>
<h3>有密码的 PDF 可以合并吗?</h3><p>暂时不行。请先用密码打开,另存一份无密码的文件。</p>
